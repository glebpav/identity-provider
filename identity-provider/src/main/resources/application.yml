server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: identity-provider
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:identity_provider}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:identity}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:identity_password}}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

identity:
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    admin-first-name: ${BOOTSTRAP_ADMIN_FIRST_NAME:Admin}
    admin-last-name: ${BOOTSTRAP_ADMIN_LAST_NAME:User}
  service-clients:
    fx-dealing:
      client-id: ${FX_DEALING_CLIENT_ID:fx-dealing}
      client-secret: ${FX_DEALING_CLIENT_SECRET:fx-dealing-local-secret}
      scopes: ${FX_DEALING_SCOPES:fx-dealing:read,fx-dealing:write}
    positioner:
      client-id: ${POSITIONER_CLIENT_ID:positioner}
      client-secret: ${POSITIONER_CLIENT_SECRET:positioner-local-secret}
      scopes: ${POSITIONER_SCOPES:positioner:read,positioner:write}
    reports:
      client-id: ${REPORTS_CLIENT_ID:reports}
      client-secret: ${REPORTS_CLIENT_SECRET:reports-local-secret}
      scopes: ${REPORTS_SCOPES:reports:read,reports:write}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  security:
    issuer: ${JWT_ISSUER:http://localhost:8080}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P30D}
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
    max-failed-login-attempts: ${MAX_FAILED_LOGIN_ATTEMPTS:5}
    lock-duration: ${LOCK_DURATION:PT15M}

logging:
  level:
    org.springframework.security: INFO
